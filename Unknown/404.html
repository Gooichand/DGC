<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Gopichand Dandimeni</title>
    <meta name="robots" content="noindex, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cormorant-typography.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050a05;
            color: #e0ffe0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container { max-width: 500px; }
        .code {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff41, #00c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.5rem;
            color: #00ff41;
            margin-bottom: 1rem;
            font-family: 'AkayaKanadaka', serif;
        }
        p { color: rgba(255,255,255,0.5); margin-bottom: 2rem; line-height: 1.6; }
        .scanline {
            width: 100px; height: 2px;
            background: #00ff41; margin: 1.5rem auto;
            box-shadow: 0 0 10px #00ff41;
            opacity: 0.5;
        }
        a {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: rgba(0,255,65,0.1);
            border: 1px solid #00ff41;
            color: #00ff41;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        a:hover { background: #00ff41; color: #050a05; box-shadow: 0 0 20px rgba(0,255,65,0.3); }
        @media (max-width: 480px) { .code { font-size: 5rem; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>Access Denied</h1>
        <div class="scanline"></div>
        <p>The page you're looking for doesn't exist or has been moved to a secure location.</p>
        <a href="./">Return to Home</a>
    </div>
</body>
</html>
